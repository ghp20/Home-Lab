version: "3.8"
    
services:
  wireguard-us-server:
    image: lscr.io/linuxserver/wireguard:${WG_TAG:-latest}
    container_name: wireguard-us-server
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - SERVERMODE=${SERVER_MODE}
    volumes:
      - ${APPS_CONFIG}:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "${SSH_PORT}:${SSH_PORT}/tcp"
      - "${HTTPS_PORT}:${HTTPS_PORT}/tcp"
    restart: unless-stopped
