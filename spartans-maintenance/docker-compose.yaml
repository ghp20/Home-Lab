version: "3.8"

services:

  postgres:
    networks:
      - backend-net
    image: postgres:15
    container_name: spartans-maintenance-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - /path/to/data/apps_config/spartans-maintenance/postgres-data:/var/lib/postgresql/data
      - /path/to/data/apps_config/spartans-maintenance/backups:/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    networks:
      - backend-net
    image: spartans-maintenance-backend:latest
    container_name: spartans-maintenance-backend
    environment:
      DATABASE_URL:                postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      SECRET_KEY: changeme
      ADMIN_USERNAME:              ${ADMIN_USERNAME}
      ADMIN_PASSWORD: changeme
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      ENVIRONMENT:                 ${ENVIRONMENT}
      CORS_ORIGINS:                ${CORS_ORIGINS}
      WEBAUTHN_RP_ID:              ${WEBAUTHN_RP_ID}
      WEBAUTHN_ORIGIN:             ${WEBAUTHN_ORIGIN}
      AUTO_MIGRATE:                "true"
    volumes:
      - /path/to/data/apps_config/spartans-maintenance/db:/data
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    networks:
      - backend-net
    image: spartans-maintenance-frontend:latest
    container_name: spartans-maintenance-frontend
    ports:
      - "8765:80"
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://10.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  backend-net: