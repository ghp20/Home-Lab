version: "3.8"

services:

  postgres:
    image: postgres:15
    container_name: spartans-maintenance-postgres
    restart: unless-stopped
    networks:
      - backend-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /path/to/data/apps_config/spartans-maintenance/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    image: spartans-maintenance-backend:latest
    container_name: spartans-maintenance-backend
    restart: unless-stopped
    networks:
      - backend-net
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: changeme
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: changeme
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      ENVIRONMENT: ${ENVIRONMENT}
      CORS_ORIGINS: ${CORS_ORIGINS}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN}
      AUTO_MIGRATE: "true"
      SECURE_COOKIES: "false"
      MAX_LOGIN_ATTEMPTS: "5"
      LOCKOUT_MINUTES: "30"
    volumes:
      - /path/to/data/apps_config/spartans-maintenance/db:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: spartans-maintenance-frontend:latest
    container_name: spartans-maintenance-frontend
    restart: unless-stopped
    networks:
      - backend-net
    ports:
      - "${APP_PORT}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://10.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  backend-net:
    name: spartans-maintenance_backend-net