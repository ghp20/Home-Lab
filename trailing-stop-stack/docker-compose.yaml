# =============================================================================
# Trailing Stop Trading Agent — Portainer Stack
# =============================================================================
# Paste this into Portainer → Stacks → Add Stack.
# Set all env vars in the "Environment variables" tab using the list above.
# The agent image must be pre-built on the host:
#   cd /path/to/data/master/hermes/ron/trailing-stop
#   docker build -t trailing_stop_agent:latest .
# =============================================================================

networks:
  trading_net:
    driver: bridge
    name: trading_net

services:

  db:
    image: postgres:16
    container_name: trailing_stop_db
    restart: unless-stopped
    networks: [trading_net]
    ports:
      - "10.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: changeme
      PGDATA: ${PGDATA}
    volumes:
      - /path/to/data/apps_config/ron/trailing-stop/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres
        -c max_connections=50
        -c shared_buffers=128MB
        -c effective_cache_size=256MB
        -c maintenance_work_mem=32MB
        -c wal_buffers=4MB
        -c log_min_duration_statement=2000

  agent:
    image: trailing_stop_agent:latest
    container_name: trailing_stop_agent
    restart: unless-stopped
    user: "3001:3000"
    networks: [trading_net]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: changeme
      DB_POOL_MIN: ${DB_POOL_MIN}
      DB_POOL_MAX: ${DB_POOL_MAX}
      DB_SSLMODE: ${DB_SSLMODE}
      ALPACA_API_KEY: changeme
      ALPACA_SECRET_KEY: changeme
      ALPACA_PAPER: ${ALPACA_PAPER}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      N8N_WEBHOOK_SECRET: changeme
      N8N_MIN_SEVERITY: ${N8N_MIN_SEVERITY}
      NOTIFY_RATE_LIMIT_SECS: ${NOTIFY_RATE_LIMIT_SECS}
      TELEGRAM_BOT_TOKEN: changeme
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      PRINCIPAL: ${PRINCIPAL}
      EQUITY_CAP: ${EQUITY_CAP}
      MAX_DAILY_LOSS: ${MAX_DAILY_LOSS}
      MAX_DRAWDOWN: ${MAX_DRAWDOWN}
      MAX_POSITIONS: ${MAX_POSITIONS}
      TRAIL_PERCENT: ${TRAIL_PERCENT}
      MIN_STOCK_PRICE: ${MIN_STOCK_PRICE}
      MIN_AVG_VOLUME: ${MIN_AVG_VOLUME}
      INTRADAY_SCAN_COUNT: ${INTRADAY_SCAN_COUNT}
      EMA_FAST: ${EMA_FAST}
      EMA_SLOW: ${EMA_SLOW}
      RSI_PERIOD: ${RSI_PERIOD}
      RSI_LOW: ${RSI_LOW}
      RSI_HIGH: ${RSI_HIGH}
      VOLUME_MA_PERIOD: ${VOLUME_MA_PERIOD}
      STOP_UPDATE_INTERVAL_SECS: ${STOP_UPDATE_INTERVAL_SECS}
      MARKET_TIMEZONE: ${MARKET_TIMEZONE}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_DIR: ${LOG_DIR}
      HOST_IP: ${HOST_IP}
      PYTHONUNBUFFERED: ${PYTHONUNBUFFERED}
      DATA_FEED: ${DATA_FEED}
      SPY_REGIME_FILTER: ${SPY_REGIME_FILTER}
    volumes:
      - /path/to/data/apps_config/ron/trailing-stop/logs:/app/logs
      - /path/to/data/apps_config/ron/trailing-stop/backtest:/app/backtest_results
    stop_grace_period: 30s