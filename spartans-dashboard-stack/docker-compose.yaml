version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: spartans-dashboard-postgres
    environment:
      POSTGRES_USER:     spartans
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB:       spartans_dashboard
    volumes:
      - dashboard-pgdata:/var/lib/postgresql/data
    networks:
      - dashboard-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spartans -d spartans_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    image: spartans-dashboard-backend:latest
    container_name: spartans-dashboard-backend
    environment:
      DATABASE_URL:                "postgresql://spartans:changeme@postgres:5432/spartans_dashboard"
      SECRET_KEY: changeme
      ADMIN_USERNAME:              "admin"
      ADMIN_PASSWORD: changeme
      ACCESS_TOKEN_EXPIRE_MINUTES: "120"
      MAX_LOGIN_ATTEMPTS:          "5"
      LOCKOUT_MINUTES:             "30"
      ENVIRONMENT:                 "production"
      POLL_INTERVAL_SECONDS:       "10"
      CORS_ORIGINS:                "https://dashboard.example.com"
      EVENTS_SECRET_KEY: changeme
      LOGISTICS_SECRET_KEY: changeme
      LOGISTICS_DASHBOARD_USER_ID: "14"
      MAINTENANCE_SECRET_KEY: changeme
      PRACTICE_SECRET_KEY: changeme
    networks:
      - dashboard-net
      - spartans-events-stack_backend-net
      - spartans-logistics_backend-net
      - spartans-maintenance_backend-net
      - spartans-practice_backend-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: spartans-dashboard-frontend:latest
    container_name: spartans-dashboard-frontend
    ports:
      - "8102:8080"
    networks:
      - dashboard-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  dashboard-net:
  spartans-events-stack_backend-net:
    external: true
  spartans-logistics_backend-net:
    external: true
  spartans-maintenance_backend-net:
    external: true
  spartans-practice_backend-net:
    external: true

volumes:
  dashboard-pgdata:
