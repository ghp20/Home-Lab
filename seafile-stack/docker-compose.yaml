version: '3.8'

services:
  db:
    image: mariadb:10.11.6
    container_name: seafile-db
    environment:
      - MYSQL_ROOT_PASSWORD=changeme
      - MYSQL_LOG_CONSOLE=${MYSQL_LOG_CONSOLE}
    volumes:
      - /path/to/data/apps_config/seafile/db:/var/lib/mysql
    networks:
      - seafile-net
    restart: unless-stopped

  memcached:
    image: memcached:1.6.23
    container_name: seafile-memcached
    entrypoint: memcached -m ${MEMCACHED_MEMORY_MB}
    networks:
      - seafile-net
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:8.13.4
    container_name: seafile-elasticsearch
    environment:
      - discovery.type=${ES_DISCOVERY_TYPE}
      - bootstrap.memory_lock=${ES_MEMORY_LOCK}
      - xpack.security.enabled=${ES_XPACK_SECURITY}
      - ES_JAVA_OPTS=${ES_JAVA_OPTS}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - /path/to/data/apps_config/seafile/elasticsearch:/usr/share/elasticsearch/data
    networks:
      - seafile-net
    restart: unless-stopped

  seafile:
    image: seafileltd/seafile-mc:${SEAFILE_VERSION_TAG}
    container_name: seafile
    ports:
      - "${SEAFILE_HTTP_PORT}:80"
    volumes:
      - /path/to/data/apps_config/seafile/shared:/shared
    environment:
      - DB_HOST=${DB_HOST}
      - DB_ROOT_PASSWD=changeme
      - SEAFILE_ADMIN_EMAIL=${SEAFILE_ADMIN_EMAIL}
      - SEAFILE_ADMIN_PASSWORD=changeme
      - SEAFILE_SERVER_LETSENCRYPT=${SEAFILE_LETSENCRYPT}
      - SEAFILE_SERVER_HOSTNAME=${SEAFILE_SERVER_HOSTNAME}
      - TIME_ZONE=${TIME_ZONE}
      - FORCE_HTTPS_IN_SEAFILE_PRO=${FORCE_HTTPS}
      - JWT_PRIVATE_KEY=changeme
    depends_on:
      - db
      - memcached
      - elasticsearch
    networks:
      - seafile-net
    restart: unless-stopped

networks:
  seafile-net:
    name: seafile-net