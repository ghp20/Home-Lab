version: "3.8"

services:

  postgres:
    networks:
      - backend-net
    image: postgres:15
    container_name: spartans-practice-postgres
    environment:
      POSTGRES_USER:     spartans
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB:       spartans_practice
    volumes:
      - /path/to/data/apps_config/spartans-practice/postgres-data:/var/lib/postgresql/data
      - /path/to/data/apps_config/spartans-practice/backups:/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spartans -d spartans_practice"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    networks:
      - backend-net
    image: spartans-practice-backend:phase1.1
    container_name: spartans-practice-backend
    environment:
      DATABASE_URL:                postgresql://spartans:changeme@postgres:5432/spartans_practice
      SECRET_KEY: changeme
      ADMIN_USERNAME:              superadmin
      ADMIN_PASSWORD: changeme
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
      ENVIRONMENT:                 production
      CORS_ORIGINS:                https://practice.example.com
      ARYA_API_KEY: changeme
    volumes:
      - /path/to/data/apps_config/spartans-practice/uploads:/app/assets/uploads
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    networks:
      - backend-net
    image: spartans-practice-frontend:phase1.3
    container_name: spartans-practice-frontend
    ports:
      - "3001:8080"
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  backend-net:
